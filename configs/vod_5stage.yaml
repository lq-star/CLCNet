# LCCNet-aligned 5-stage curriculum on VoD
data_folder: ../data/VoD
epochs_per_stage: 40
batch_size: 16
lr: 3.0e-4
train_iters: 1
lambda_conf: 0.2
lambda_gate: 0.05
stages:
  - name: iter1
    max_r: 20.0
    max_t: 1.5
  - name: iter2
    max_r: 10.0
    max_t: 1.0
  - name: iter3
    max_r: 5.0
    max_t: 0.5
  - name: iter4
    max_r: 2.0
    max_t: 0.2
  - name: iter5
    max_r: 1.0
    max_t: 0.1
